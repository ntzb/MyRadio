name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the APK to a Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Decode signing keystore (if configured)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks"
              echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "Signing with the stable keystore."
          else
            echo "No KEYSTORE_BASE64 secret set — using the default debug key."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MyRadio.apk

      # Raw, directly-downloadable APK (not zipped) on the Releases page.
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest debug build
          files: MyRadio.apk

      # Also keep it as a build artifact (zipped) for history.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: myradio-debug
          path: MyRadio.apk
          if-no-files-found: error
