name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # publish the APK to a Release
      security-events: write   # upload Trivy SARIF + read code-scanning alert counts
    env:
      # Surfaced as an env var so we can skip the scan when the secret isn't configured
      # (secrets can't be referenced directly in a step `if:`).
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.4.1"

      - name: Decode signing keystore (if configured)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks"
              echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "Signing with the stable keystore."
          else
            echo "No KEYSTORE_BASE64 secret set — using the default debug key."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MyRadio.apk

      # Scan the built APK against 70+ AV engines. Informational (continue-on-error) so a transient
      # VirusTotal hiccup or a generic false-positive doesn't block the release; the report link is
      # printed in the step log.
      - name: Scan APK with VirusTotal
        id: vt
        if: env.VT_API_KEY != ''
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: MyRadio.apk

      # Raw, directly-downloadable APK (not zipped) on the Releases page.
      - name: Publish APK to Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: latest
          name: Latest debug build
          files: MyRadio.apk

      # Also keep it as a build artifact (zipped) for history.
      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: myradio-debug
          path: MyRadio.apk
          if-no-files-found: error

      # --- Security scans (results consolidated into the run summary table below) ---
      # Runs even if the build failed — it scans the source, and keeps the SARIF upload below
      # (which is `if: always()`) from erroring on a missing file.
      - name: Trivy filesystem scan
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy.sarif
          exit-code: "0"   # report-only; don't fail the build

      - name: Upload Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          sarif_file: trivy.sarif

      - name: Security summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 🔒 Security scans"
            echo ""
            echo "| Scan | Result | Details |"
            echo "|------|--------|---------|"
          } >> "$GITHUB_STEP_SUMMARY"

          # VirusTotal (APK). A freshly-uploaded APK is usually still being analysed, and the file
          # endpoint reports last_analysis_stats as all-zero until engines report — so 0 malicious
          # only means "clean" once the engine TOTAL is > 0. Poll up to ~90s, else say it's pending.
          if [ -n "$VT_API_KEY" ] && [ -f MyRadio.apk ]; then
            sha=$(sha256sum MyRadio.apk | cut -d' ' -f1)
            link="https://www.virustotal.com/gui/file/$sha"
            mal=0; sus=0; total=0
            for _ in 1 2 3 4 5 6; do
              stats=$(curl -s -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/files/$sha" || true)
              mal=$(echo "$stats" | jq -r '.data.attributes.last_analysis_stats.malicious // 0' 2>/dev/null)
              sus=$(echo "$stats" | jq -r '.data.attributes.last_analysis_stats.suspicious // 0' 2>/dev/null)
              total=$(echo "$stats" | jq -r '[(.data.attributes.last_analysis_stats // {}) | .[]] | add // 0' 2>/dev/null)
              [ "${total:-0}" -gt 0 ] 2>/dev/null && break
              sleep 15
            done
            if [ "${total:-0}" -gt 0 ] 2>/dev/null; then
              if [ "${mal:-0}" = "0" ] && [ "${sus:-0}" = "0" ]; then icon="🟢"; else icon="🔴"; fi
              result="$icon ${mal} malicious / ${sus} suspicious (of ${total} engines)"
            else
              result="⏳ still analysing — open report shortly"
            fi
            echo "| VirusTotal (APK) | ${result} | [report]($link) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| VirusTotal (APK) | ⚪ skipped (no VT_API_KEY) | — |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Trivy — count of HIGH/CRITICAL findings from this run.
          if [ -f trivy.sarif ]; then
            n=$(jq '[.runs[].results[]] | length' trivy.sarif 2>/dev/null || echo "?")
            if [ "$n" = "0" ]; then icon="🟢"; else icon="🔴"; fi
            echo "| Trivy (deps/secrets/config) | ${icon} ${n} HIGH/CRITICAL | Security ▸ Code scanning |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Trivy (deps/secrets/config) | ⚪ not run | — |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Code scanning open alerts (includes CodeQL, which runs as its own setup) + Dependabot.
          alerts=$(gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" --jq 'length' 2>/dev/null || echo "n/a")
          if [ "$alerts" = "0" ]; then icon="🟢"; elif [ "$alerts" = "n/a" ]; then icon="⚪"; else icon="🟡"; fi
          echo "| CodeQL / code scanning (all tools) | ${icon} ${alerts} open | [Code scanning](https://github.com/${GITHUB_REPOSITORY}/security/code-scanning) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependabot | 🔗 see alerts | [Dependabot](https://github.com/${GITHUB_REPOSITORY}/security/dependabot) |" >> "$GITHUB_STEP_SUMMARY"
